name: Limpieza de la cola (retira ruido, no borra)
on:
  workflow_dispatch:
    inputs:
      prueba: { description: "Solo mostrar qué retiraría", type: boolean, default: true }
      reiniciar_indices: { description: "Releer los índices (tras corregir el filtro)", type: boolean, default: false }
permissions: { contents: read }
jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m unittest test_supa test_limpieza_cola
        working-directory: bot
      - run: python limpieza_cola.py ${{ inputs.prueba && '--prueba' || '' }} ${{ inputs.reiniciar_indices && '--reiniciar-indices' || '' }} --reevaluar-municipales
        working-directory: bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.service_role }}
