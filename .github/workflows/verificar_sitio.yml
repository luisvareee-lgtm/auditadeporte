name: Verificar el sitio publicado (solo lectura)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
        working-directory: bot/verificacion
      - run: node verificar_sitio.mjs
        working-directory: bot/verificacion
