name: Verificar el sitio publicado (solo lectura)
on: { workflow_dispatch: { inputs: { script: { description: "verificar_sitio.mjs o recorrer_sitio.mjs", default: "verificar_sitio.mjs" } } } }
permissions: { contents: read }
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
        working-directory: bot/verificacion
      - run: node ${{ inputs.script || 'verificar_sitio.mjs' }}
        working-directory: bot/verificacion
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capturas, path: bot/verificacion/capturas/, if-no-files-found: ignore, retention-days: 7 }
