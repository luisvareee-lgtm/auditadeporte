name: Población y forma de los municipios (Censo 2022 y georef)
on: { workflow_dispatch: { inputs: { diagnostico: { description: "Solo listar cuadros del INDEC", type: boolean, default: false } } } }
permissions: { contents: write }
jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install "openpyxl>=3.1,<4"
      - run: python geo_municipios.py
        working-directory: bot
        env: { DIAGNOSTICO: "${{ inputs.diagnostico && '1' || '' }}" }
      - run: |
          git config user.name "auditadeporte-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/municipios_geo.json
          git diff --cached --quiet && echo "sin cambios" || (git commit -m "Población (Censo 2022) y forma de los municipios" && git pull --rebase && git push)
