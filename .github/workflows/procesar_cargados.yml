name: Analizar PDFs cargados a mano
on:
  schedule: [{ cron: "17 * * * *" }]     # cada hora: si no hay nada pendiente termina en segundos
  workflow_dispatch: {}
permissions: { contents: read }
concurrency: { group: cargados, cancel-in-progress: false }
jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: ¿Hay documentos pendientes?
        id: hay
        working-directory: bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.service_role }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT" || { echo "pendientes=0"; echo "oficina=0"; } >> "$GITHUB_OUTPUT"
          import orquestador_bots_audita as o
          try:
              filas = o.db().table('documentos_cargados').select('id,formato').eq('estado', 'pendiente').execute().data or []
          except Exception:
              filas = []
          print(f"pendientes={len(filas)}")
          print(f"oficina={sum(1 for f in filas if (f.get('formato') or 'pdf') not in ('pdf','jpg','png','tif','webp'))}")
          PY
          cat "$GITHUB_OUTPUT"
      - name: Lectores de PDF y OCR en español
        if: steps.hay.outputs.pendientes != '0' || github.event_name == 'workflow_dispatch'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-spa fonts-dejavu-core poppler-utils > /dev/null
          # LibreOffice solo si hay Word, planillas o texto pendientes (o al probarlo a mano): tarda en instalarse
          if [ "${{ steps.hay.outputs.oficina }}" != "0" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            timeout 900 sudo -E apt-get install -y -qq --no-install-recommends -o Dpkg::Options::="--force-confnew" \
              libreoffice-writer-nogui libreoffice-calc-nogui > /dev/null && soffice --version || echo "LibreOffice no se instaló: esos formatos quedan con error y se reintentan"
          fi
          pip install "pypdf>=4,<7" "pypdfium2>=4,<6" "pytesseract>=0.3,<0.4" "pillow>=10,<12" "openpyxl>=3.1,<4" "python-docx>=1,<2"
      - name: Tests
        if: steps.hay.outputs.pendientes != '0' || github.event_name == 'workflow_dispatch'
        run: python -m unittest test_supa test_analista_pdf test_vigia test_convertir test_rafam
        working-directory: bot
      - name: Analizar (página por página, con OCR) y proponer a la cola de revisión
        if: steps.hay.outputs.pendientes != '0'
        run: python procesar_cargados.py
        working-directory: bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.service_role }}
      - name: Vigía (si hay alertas nuevas la corrida queda en rojo y GitHub te avisa por correo)
        if: steps.hay.outputs.pendientes != '0'
        run: python vigia.py
        working-directory: bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.service_role }}
