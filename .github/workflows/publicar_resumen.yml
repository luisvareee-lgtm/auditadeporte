name: Publicar resumen ciudadano
on:
  workflow_run:
    workflows: ["Agentes AuditaDeporte"]
    types: [completed]
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: publicar-resumen, cancel-in-progress: false }
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Tests
        run: python -m unittest test_supa test_generar_resumen
        working-directory: bot
      - name: Armar datos/transparencia.json (solo datos agregados y públicos)
        run: python generar_resumen.py
        working-directory: bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.service_role }}
      - name: Publicar si cambió
        run: |
          git config user.name "auditadeporte-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/transparencia.json
          git diff --cached --quiet && echo "sin cambios" || (git commit -m "Resumen ciudadano: actualización automática" && git push)
