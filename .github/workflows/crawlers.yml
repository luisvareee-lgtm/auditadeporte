name: Bots Auditoria Federal BSR

on:
  schedule:
    - cron: '0 9 * * *' # Corre todos los días a las 06:00 AM Argentina
  workflow_dispatch:     # Permite ejecutarlo manualmente con 1 clic en GitHub

jobs:
  ejecutar-bots-osint:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Orquestador de Bots (Padrón BSR + PDFs + SHA-256)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ls -la
          python orquestador_bots_audita.py
