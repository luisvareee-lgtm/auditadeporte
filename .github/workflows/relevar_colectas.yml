name: Relevamiento de colectas en Instagram (cuentas oficiales)
on:
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo leer y mostrar el resumen (no escribe en la base)"
        type: boolean
        default: true
      desde:
        description: "Desde qué fecha (AAAA-MM-DD)"
        default: "2024-01-01"
  schedule: [{ cron: "30 13 1 * *" }]      # día 1 de cada mes
permissions: { contents: read }
concurrency: { group: actualidad-redes, cancel-in-progress: false }
jobs:
  colectas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Tests
        run: python -m unittest test_supa test_relevar_colectas
        working-directory: bot
      - name: Relevar (no guarda textos, nombres, alias ni CBU)
        run: python relevar_colectas.py --desde "${{ inputs.desde || '2024-01-01' }}" ${{ (github.event_name == 'schedule' || !inputs.prueba) && ' ' || '--prueba' }}
        working-directory: bot
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.service_role }}
