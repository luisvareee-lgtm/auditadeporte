name: Agentes AuditaDeporte
on:
  schedule: [{ cron: "0 11 * * *" }]     # diario, 08:00 hora Argentina
  workflow_dispatch:
    inputs:
      forzar: { description: "Revisar todas las fuentes aunque no les toque", type: boolean, default: false }
permissions: { contents: read }
concurrency: { group: agentes, cancel-in-progress: false }
jobs:
  agentes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Lectores de PDF y OCR en español (cada página, también escaneos)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          timeout 300 sudo -E apt-get -o DPkg::Lock::Timeout=120 update -qq && timeout 600 sudo -E apt-get -o DPkg::Lock::Timeout=120 install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-spa fonts-dejavu-core poppler-utils > /dev/null
          pip install "pypdf>=4,<7" "pypdfium2>=4,<6" "pytesseract>=0.3,<0.4" "pillow>=10,<12"
      - name: Tests (si fallan, no se ejecuta ningún agente)
        run: python -m unittest test_supa test_orquestador test_mesa_ingesta test_especialistas test_busqueda_dirigida test_analista_pdf test_vigia test_rafam
        working-directory: bot
      - name: Rastreador de documentos (fuentes del panel + sitemaps)
        run: python orquestador_bots_audita.py
        working-directory: bot
        env:
          FORZAR_REVISION: ${{ inputs.forzar && '1' || '0' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.service_role }}
      - name: Vigía (alertas objetivas; si hay nuevas la corrida queda en rojo y GitHub te avisa por correo)
        id: vigia
        continue-on-error: true
        run: python vigia.py
        working-directory: bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.service_role }}
      - name: Ingesta de novedades (feeds oficiales)
        run: python ingesta_redes.py
        working-directory: bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.service_role }}
      - name: Especialistas y guardián de seguridad (termina en rojo si hay un hallazgo crítico)
        if: always()
        run: python especialistas.py
        working-directory: bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.service_role }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SITIO_URL: https://auditadeporte.vercel.app/      # el sitio está en Vercel (antes GitHub Pages)
      - name: Avisar alertas nuevas del vigía
        if: steps.vigia.outcome == 'failure'
        run: echo "Hay alertas nuevas del vigía. Entrá al panel, pestaña Alertas." && exit 1
