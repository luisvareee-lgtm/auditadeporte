name: Explorar fuentes oficiales (solo lectura)
on: { workflow_dispatch: { inputs: { lista: { description: "archivo json en bot/", default: "sitios_candidatos.json" } } } }
permissions: { contents: read }
jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python explorar_fuentes.py ${{ inputs.lista }}
        working-directory: bot
