        // ============================================================================

        function clasificarEstadoAccesible(valorTexto) {
            const v = (valorTexto || "").toUpperCase();
            if (v.includes("SI_") || v.includes("CUBIERTO") || v.includes("EQUIPADO")) {
                return { badgeClass: "bg-emerald-100 text-emerald-950 border-emerald-700", iconName: "check-circle-2", iconColor: "text-emerald-800", label: "Cubierto / Verificado" };
            }
            if (v.includes("PARCIAL") || v.includes("DEPENDENCIA") || v.includes("BECAS_PROVINCIALES")) {
                return { badgeClass: "bg-amber-100 text-amber-950 border-amber-700", iconName: "alert-triangle", iconColor: "text-amber-900", label: "Parcial / Con Reclamos" };
            }
            return { badgeClass: "bg-red-100 text-red-950 border-red-800", iconName: "x-circle", iconColor: "text-red-800", label: "Irregular / Sin Partida" };
        }

        function crearFilaSemaforoWCAG(tituloRubro, detalleRubro) {
            const cfg = clasificarEstadoAccesible(detalleRubro);
            return `
                <div class="p-3.5 rounded-xl bg-slate-50 border-2 border-slate-300 flex flex-col sm:flex-row sm:items-center justify-between gap-2" role="group" aria-label="Rubro ${tituloRubro}: Estado ${cfg.label} (${detalleRubro})">
                    <div>
                        <span class="font-extrabold text-slate-950 text-sm block">${tituloRubro}</span>
                        <span class="text-xs text-slate-700 font-medium">${detalleRubro}</span>
                    </div>
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg border-2 font-extrabold text-xs shrink-0 ${cfg.badgeClass}">
                        <span>${cfg.label}</span>
                    </span>
                </div>
            `;
        }

        async function cargarRadiografiaClub(nombreBusqueda) {
            nombreClubActivo = nombreBusqueda;
            const club = clubesFabaData.find(c => c.nombre_actual.toLowerCase().includes(nombreBusqueda.toLowerCase())) || clubesFabaData[0];
            clubActivoId = club.id || club.nombre_actual;

            const tituloEl = document.getElementById("wcag-club-titulo");
            if (tituloEl) tituloEl.innerText = club.nombre_actual;

            const tipoEl = document.getElementById("wcag-club-tipo");
            if (tipoEl) tipoEl.innerText = club.tipo_entidad || "MUNICIPAL";

            const juriEl = document.getElementById("wcag-club-jurisdiccion");
            if (juriEl) juriEl.innerText = club.jurisdiccion || club.provincia_normalizada || "Federal";

            const autoEl = document.getElementById("wcag-club-autoridad");
            if (autoEl) autoEl.innerText = club.autoridad_actual || "Comisión Directiva";

            const desfEl = document.getElementById("wcag-club-desfasaje");
            if (desfEl) desfEl.innerText = club.dato_desactualizado_oficial || "Padrón FABA histórico.";

            const score = club.itg_score || 30;
            const scoreEl = document.getElementById("wcag-itg-score");
            const badgeEl = document.getElementById("wcag-itg-badge");
            
            if (scoreEl) scoreEl.innerText = `${score} / 100`;

            if (badgeEl) {
                if (score <= 30) {
                    if (scoreEl) scoreEl.className = "text-2xl md:text-3xl font-black text-red-400";
                    badgeEl.className = "text-xs font-extrabold px-3 py-1 rounded bg-red-800 text-white border border-red-400";
                    badgeEl.innerText = "OPACIDAD CRÍTICA";
                } else {
                    if (scoreEl) scoreEl.className = "text-2xl md:text-3xl font-black text-amber-300";
                    badgeEl.className = "text-xs font-extrabold px-3 py-1 rounded bg-amber-700 text-white border border-amber-300";
                    badgeEl.innerText = "OPACIDAD MEDIA / ALTA";
                }
            }

            const semContenedor = document.getElementById("wcag-semaforo-contenedor");
            if (semContenedor) {
                semContenedor.innerHTML =
                    crearFilaSemaforoWCAG("Sillas de Ruedas y Repuestos", club.provee_sillas_repuestos || "PARCIAL") +
                    crearFilaSemaforoWCAG("Transporte y Logística Federal", club.provee_transporte || "IRREGULAR") +
                    crearFilaSemaforoWCAG("Becas Deportivas y Viáticos", club.provee_becas_viaticos || "SIN_DATOS");
            }

            const firmasActuales = contadoresFirmasLocal[nombreBusqueda] || 14;
            const pct = Math.min(100, Math.round((firmasActuales / UMBRAL_TAD) * 100));
            
            const firmasTxt = document.getElementById("wcag-firmas-texto");
            if (firmasTxt) firmasTxt.innerText = `${firmasActuales} / ${UMBRAL_TAD} Firmas Verificadas`;
            
            const progBar = document.getElementById("wcag-progressbar");
            if (progBar) progBar.setAttribute("aria-valuenow", firmasActuales);
            
            const progFill = document.getElementById("wcag-progressbar-fill");
            if (progFill) progFill.style.width = `${pct}%`;

            const osintOrig = document.getElementById("wcag-osint-origen");
            if (osintOrig) osintOrig.innerText = club.estado_redes_sociales || "Monitoreo activo";

            const osintCita = document.getElementById("wcag-osint-cita");
            if (osintCita) osintCita.innerText = `"${club.ultima_actividad_osint || 'Sin actividad reciente'}"`;

            const osintIa = document.getElementById("wcag-osint-ia");
            if (osintIa) osintIa.innerText = `${club.perfil_skills_responsables || 'Comisión Directiva'} — ${club.realidad_verificada_2026 || 'Relevamiento federal'}`;

            const osintUrl = document.getElementById("wcag-osint-url");
            if (osintUrl) osintUrl.href = club.enlace_evidencia_url || "#";

            const hashStr = club.hash_evidencia || "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855";
            const hashEl = document.getElementById("wcag-osint-hash");
            if (hashEl) hashEl.innerText = `SHA-256: ${hashStr.substring(0, 26)}...`;

            if (window.lucide) window.lucide.createIcons();
        }

        function cambiarTab(tabId) {
            ['tab-dashboard', 'tab-responsables', 'tab-clubes', 'tab-osint', 'tab-becas'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
                const btn = document.getElementById('btn-' + id);
                if (btn) btn.classList.remove('tab-active');
            });
            const targetEl = document.getElementById(tabId);
            if (targetEl) targetEl.classList.remove('hidden');
            const targetBtn = document.getElementById('btn-' + tabId);
            if (targetBtn) targetBtn.classList.add('tab-active');
            if (window.lucide) window.lucide.createIcons();
        }

        function renderizarBoletines(lista) {
            const tbody = document.getElementById('tabla-boletines-body');
            if (!tbody) return;
            tbody.innerHTML = lista.map(b => `

                    <td class="p-2.5"><span class="bg-slate-200 text-slate-800 font-semibold px-2 py-0.5 rounded text-[11px]">${b.portal_origen || 'OFICIAL'}</span></td>
                    <td class="p-2.5 font-mono text-[11px] text-emerald-800 font-semibold">${(b.hash_sha256_documento || '').substring(0, 18)}...</td>
                    <td class="p-2.5"><a href="${b.url_fuente_oficial || '#'}" target="_blank" class="text-blue-700 hover:underline font-extrabold">Abrir PDF ↗</a></td>
                </tr>
            `).join('');
        }

        function renderizarFuncionarios() {
            const cont = document.getElementById('contenedor-funcionarios');
            if (!cont) return;
            cont.innerHTML = funcionariosData.map(f => `
                <div class="bg-white p-5 rounded-xl border-2 border-slate-300 shadow-sm flex flex-col justify-between">

        function renderizarClubes(filtro = 'TODOS') {
            const tbody = document.getElementById('tabla-clubes-body');
            if (!tbody) return;
            const lista = filtro === 'TODOS' ? clubesFabaData : clubesFabaData.filter(c => c.tipo_entidad === filtro || (c.estado_actual || '').includes(filtro));

            const badgeTipo = {
                'MUNICIPAL': '<span class="bg-blue-100 text-blue-900 border border-blue-700 px-2 py-0.5 rounded font-extrabold">🏛️ MUNICIPAL</span>',
                'ASOCIACION_CIVIL_ONG': '<span class="bg-purple-100 text-purple-900 border border-purple-700 px-2 py-0.5 rounded font-extrabold">🤝 ASOC. CIVIL / ONG</span>',
                'CONVENIO_CLUB': '<span class="bg-emerald-100 text-emerald-900 border border-emerald-700 px-2 py-0.5 rounded font-extrabold">🛡️ CONVENIO CLUB</span>'
            };

            tbody.innerHTML = lista.map(c => `
                <tr class="hover:bg-slate-50">
                    <td class="p-3 font-bold text-slate-900">${c.nombre_actual}<br><span class="text-[11px] font-normal text-slate-600">${c.jurisdiccion || ''}</span></td>
                    <td class="p-3">${badgeTipo[c.tipo_entidad] || '<span class="bg-blue-100 text-blue-900 border border-blue-700 px-2 py-0.5 rounded font-extrabold">FEDERAL</span>'}</td>
                    <td class="p-3"><span class="font-extrabold text-emerald-800">${c.estado_actual || 'ACTIVO'}</span></td>
                    <td class="p-3 text-slate-700 max-w-xs">${c.realidad_verificada_2026 || ''}</td>
                    <td class="p-3 font-semibold">${c.provee_sillas_repuestos || 'PARCIAL'}</td>
                    <td class="p-3 font-semibold">${c.provee_transporte || 'PARCIAL'}</td>
                    <td class="p-3 font-semibold">${c.provee_becas_viaticos || 'PARCIAL'}</td>
                    <td class="p-3"><button onclick="seleccionarReclamo('ONG_SOCIO_BALANCE', '${c.nombre_actual}')" class="bg-blue-700 text-white px-2.5 py-1 rounded font-bold text-[11px]">⚖️ Reclamar</button></td>
                </tr>`).join('');
        }

        function renderizarTarjetasOSINT(lista) {
            const cont = document.getElementById('contenedor-osint-cards');
            if (!cont) return;
            const contadorEl = document.getElementById('contador-clubes-osint');
            if (contadorEl) contadorEl.innerText = lista.length;

            cont.innerHTML = lista.map(c => `
                <div class="bg-white rounded-xl border-2 border-slate-300 shadow-sm p-5 flex flex-col justify-between space-y-4">
                    <div>
                        <span class="text-[11px] font-extrabold uppercase px-2 py-0.5 rounded bg-blue-100 text-blue-900 border border-blue-700">${c.tipo_entidad || 'FEDERAL'} • ${c.jurisdiccion || ''}</span>
                        <h4 class="text-lg font-black text-slate-950 mt-1">${c.nombre_actual}</h4>
                        <div class="mt-3 space-y-2 text-xs">
                            <p class="p-2.5 bg-slate-50 rounded-lg border border-slate-300"><strong>📅 Última Actividad:</strong> ${c.ultima_actividad_osint || ''}</p>
                            <p class="p-2.5 bg-amber-50 rounded-lg border border-amber-400 text-amber-950"><strong>📡 Estado de Redes:</strong> ${c.estado_redes_sociales || ''}</p>
                        </div>
                    </div>
                    <button onclick="cargarRadiografiaClub('${c.nombre_actual}'); window.scrollTo({top: 0, behavior: 'smooth'});" class="bg-slate-900 text-white font-extrabold px-3 py-2 rounded-lg text-xs w-full">
                        🔍 Inspeccionar en Card Interactiva WCAG
                    </button>
                </div>`).join('');
        }

        function seleccionarReclamo(codigoPlantilla, nombreEntidad = '') {
            cambiarTab('tab-becas');
            if (nombreEntidad) {
                const inputEntidad = document.getElementById('input-entidad-personalizada');
                if (inputEntidad) inputEntidad.value = nombreEntidad;
            }
        }

        function abrirModal(id) { const m = document.getElementById(id); if(m) m.classList.remove('hidden'); }
        function cerrarModal(id) { const m = document.getElementById(id); if(m) m.classList.add('hidden'); }

        // ============================================================================
        // INICIO Y CARGA ASINCRÓNICA FEDERAL DESDE SUPABASE
        // ============================================================================
        window.onload = async function() {
            renderizarBoletines(boletinesData);
            renderizarFuncionarios();
            renderizarClubes('TODOS');
            renderizarTarjetasOSINT(clubesFabaData);

            if (supabaseClient) {
                try {
                    // Cargar TODOS los clubes del Padrón Federal sin filtros restrictivos
                    const { data: clu, error: errClu } = await supabaseClient.from('padron_clubes_faba').select('*');
                    const { data: nov } = await supabaseClient.from('osint_novedades_cancha').select('*').order('fecha_registro', { ascending: false }).limit(100);

                    if (!errClu && clu && clu.length > 0) {
                        clubesFabaData = clu.map(c => {
                            const ultimaNov = (nov || []).find(n => n.club_id === c.id);
                            return {
                                ...c,
                                ultima_actividad_osint: ultimaNov ? ultimaNov.cita_textual : (c.ultima_actividad_osint || c.realidad_verificada_2026 || "Monitoreo federal activo"),
                                perfil_skills_responsables: ultimaNov ? ultimaNov.analisis_ia_contradiccion : (c.perfil_skills_responsables || c.autoridad_actual || "Comisión Directiva"),
                                enlace_evidencia_url: ultimaNov ? ultimaNov.url_evidencia : (c.enlace_evidencia_url || "https://www.facebook.com/fababasquetadaptado"),
                                hash_evidencia: ultimaNov ? ultimaNov.hash_sha256 : (c.hash_evidencia || "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855")
                            };
                        });

                        // Alimentar el selector desplegable con todos los clubes del barrido federal
                        const selector = document.getElementById('selector-club-radiografia');
                        if (selector) {
                            selector.innerHTML = clubesFabaData.map(c =>
                                `<option value="${c.nombre_actual}">📍 ${c.nombre_actual} (${c.jurisdiccion || c.provincia_normalizada || 'Federal'})</option>`
                            ).join('');
                        }

                        renderizarClubes('TODOS');
                        renderizarTarjetasOSINT(clubesFabaData);
                        if (clubesFabaData.length > 0) {
                            cargarRadiografiaClub(clubesFabaData[0].nombre_actual);
                        }
                        console.log(`✅ ¡Padrón Federal sincronizado con éxito! Total clubes: ${clubesFabaData.length}`);
                    }
                } catch (e) {
                    console.warn("Aviso de lectura en vivo desde Supabase:", e);
                }
            }

            if (window.lucide) window.lucide.createIcons();
        };
